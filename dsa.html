<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #080d19;
    color: white;
    line-height: 1.6;

header {
    background: #111b2e;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #24334b;
}

.logo {
    color: #38bdf8;
    font-size: 24px;
    font-weight: bold;
}

header a {
    color: #38bdf8;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: 45px auto;
    padding: 20px;
}

.heading {
    text-align: center;
    margin-bottom: 40px;
}

.heading h1 {
    font-size: 38px;
    color: #38bdf8;
}

.heading p {
    color: #a5b4c8;
    margin-top: 8px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 22px;
}

.topic-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.topic-card {
    background: #111b2e;
    border: 1px solid #24334b;
    padding: 25px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.topic-card:hover {

    border-color: #38bdf8;
}

.topic-card h3 {
    color: #38bdf8;
    margin-bottom: 8px;
}

.topic-card p {
    color: #a5b4c8;
    font-size: 14px;
}

.topic-icon {
    font-size: 30px;
    margin-bottom: 12px;
}

#problemsPage, #solutionPage {
    display: none;
}

.back-btn {
    background: transparent;
    border: 1px solid #38bdf8;
    color: #38bdf8;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 25px;
}

.back-btn:hover {
    background: #38bdf8;
    color: #080d19;
}

.problem-card {
    background: #111b2e;
    border: 1px solid #24334b;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.problem-card:hover {
    border-color: #38bdf8;
    transform: translateX(5px);
}

.problem-card h3 {
    color: #38bdf8;
    margin-bottom: 7px;
}

.problem-card p {
    color: #a5b4c8;
    font-size: 14px;
}

.difficulty {
    display: inline-block;
    background: #153c32;
    color: #4ade80;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;
}

.medium {
    background: #443519;
    color: #facc15;
}

.hard {
    background: #482323;
    color: #f87171;
}

.solution-box {
    background: #111b2e;
    padding: 25px;
    border: 1px solid #24334b;
    border-radius: 12px;
}

.solution-box h2 {
    color: #38bdf8;
    margin-bottom: 12px;
}

.description {
    color: #cbd5e1;
    margin: 15px 0;
}

.code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
    margin-bottom: 10px;
}

pre {
    background: #050914;
    padding: 20px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid #24334b;
}

code {
    color: #7dd3fc;
    font-family: Consolas, monospace;
    font-size: 14px;
    white-space: pre;
}

.copy-btn {
    background: #38bdf8;
    color: #080d19;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.copy-btn:hover {
    background: #7dd3fc;
}

.info {
    color: #a5b4c8;
    margin-top: 18px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #a5b4c8;
    border-top: 1px solid #24334b;
    margin-top: 60px;
}

@media(max-width: 750px) {
    .topic-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .heading h1 {
        font-size: 29px;
    }
}

@media(max-width: 480px) {
    .topic-grid {
        grid-template-columns: 1fr;
    }

    header {
        padding: 18px;
    }
}
</style>
</head>

let currentTopic = 0;
let currentProblem = 0;


// DISPLAY TOPIC CARDS

function loadTopics() {

    const grid = document.getElementById("topicGrid");

    grid.innerHTML = "";

    topics.forEach((topic, index) => {

        grid.innerHTML += `
            <div class="topic-card"
                 onclick="openTopic(${index})">

                <div class="topic-icon">${topic.icon}</div>

                <h3>${topic.name}</h3>

                <p>${topic.description}</p>

                <p style="margin-top:12px;color:#38bdf8;">
                    ${topic.problems.length} Problems →
                </p>

            </div>
        `;

    });

}


// OPEN SELECTED TOPIC

function openTopic(index) {

    currentTopic = index;

    const topic = topics[index];

    document.getElementById("topicsPage").style.display = "none";
    document.getElementById("problemsPage").style.display = "block";
    document.getElementById("solutionPage").style.display = "none";

    document.getElementById("topicHeading").textContent = topic.name;

    const list = document.getElementById("problemList");

    list.innerHTML = "";

    topic.problems.forEach((problem, index) => {

        let difficultyClass = problem.difficulty.toLowerCase();

        list.innerHTML += `
            <div class="problem-card"
                 onclick="openProblem(${index})">

                <h3>${index + 1}. ${problem.title}</h3>

                <p>${problem.description}</p>

                <span class="difficulty ${difficultyClass}">
                    ${problem.difficulty}
                </span>

                <p style="color:#38bdf8;margin-top:10px;">
                    View Solution →
                </p>

            </div>
        `;

    });

}


// OPEN SELECTED PROBLEM

function openProblem(index) {

    currentProblem = index;

    const problem = topics[currentTopic].problems[index];

    document.getElementById("topicsPage").style.display = "none";
    document.getElementById("problemsPage").style.display = "none";
    document.getElementById("solutionPage").style.display = "block";

    document.getElementById("problemTitle").textContent = problem.title;

    document.getElementById("problemDifficulty").textContent =
        problem.difficulty;

    document.getElementById("problemDescription").textContent =
        problem.description;

    document.getElementById("complexity").textContent =
        "Time Complexity: " + problem.time +
        " | Space Complexity: " + problem.space;

    document.getElementById("javaCode").textContent = problem.code;

}


// BACK TO TOPICS

function showTopics() {

    document.getElementById("topicsPage").style.display = "block";
    document.getElementById("problemsPage").style.display = "none";
    document.getElementById("solutionPage").style.display = "none";

}


// BACK TO PROBLEMS

function showProblems() {

    document.getElementById("topicsPage").style.display = "none";
    document.getElementById("problemsPage").style.display = "block";
    document.getElementById("solutionPage").style.display = "none";

}


// COPY JAVA CODE

function copyCode() {

    const code = document.getElementById("javaCode").textContent;

    navigator.clipboard.writeText(code).then(() => {

        const button = document.querySelector(".copy-btn");

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = "Copy Code";
        }, 1500);

    }).catch(() => {
        alert("Unable to copy. Please select and copy the code manually.");
    });

}
